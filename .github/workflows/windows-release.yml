# Windows 发布流程：分离工具快照与产品源码，冻结/安装/升级检查通过后生成附件。
# PR/push 只构建验工；已发布事件或手动调度才进入上传，公开草稿还须显式 publish_draft。
name: Windows release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build or backfill (e.g. v0.9.1)'
        required: true
        type: string
      publish_draft:
        description: 'Publish an existing draft only after build and installer checks succeed'
        required: false
        default: false
        type: boolean
      tooling_ref:
        # 新依赖的发布可锁定已核验工具提交；留空保留默认分支补编译旧标签的行为。
        description: 'Build tooling ref; empty uses the default branch'
        required: false
        default: ''
        type: string
      source_ref:
        # 同版本重打包先验证新提交，避免构建前就改动公开标签；留空继续读取版本标签。
        description: 'Optional full source commit SHA; empty uses the release tag'
        required: false
        default: ''
        type: string
      build_only:
        # 先生成可核验附件；显式开启后跳过上传，现有正式 Release 保持可下载。
        description: 'Build and verify artifacts without replacing release assets'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'packaging/windows/**'
      - 'scripts/build_release.py'
      - 'scripts/test_installer.ps1'
      - 'requirements-release.txt'
  push:
    branches: ['**']
    paths:
      - '.github/workflows/windows-release.yml'
      - 'packaging/windows/**'
      - 'scripts/build_release.py'
      - 'scripts/test_installer.ps1'
      - 'requirements-release.txt'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # 手动发布可锁定工具版本；PR/push 验证当前提交，历史补编译默认使用默认分支。
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.sha || inputs.tooling_ref || github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - name: Validate release tag
        id: source
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:EVENT_NAME -in @('pull_request', 'push')) {
            "ref=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
            "version=" >> $env:GITHUB_OUTPUT
          } else {
            if ($env:RELEASE_TAG -notmatch '^v?\d+\.\d+\.\d+$') { throw 'Expected a numeric release tag' }
            if ($env:SOURCE_REF) {
              # 输入只允许完整提交摘要，经环境变量读取，不插入可执行脚本。
              if ($env:SOURCE_REF -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full source commit SHA' }
              "ref=$env:SOURCE_REF" >> $env:GITHUB_OUTPUT
            } else {
              "ref=refs/tags/$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
            }
            "version=$($env:RELEASE_TAG -replace '^v','')" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: tooling/requirements-release.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r tooling/requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          # 使用 runner 已有 Inno Setup，不在线安装未锁定的替代构建工具。
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Runner Inno Setup compiler missing' }
          Write-Output "Inno Setup: $((Get-Item -LiteralPath $compiler).VersionInfo.FileVersion)"
      - name: Build and verify frozen application
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
          PYTHONIOENCODING: utf-8
        run: |
          $commit = git -C source rev-parse HEAD
          $arguments = @('-B','tooling/scripts/build_release.py','--source-dir','source','--output-dir','release-output','--source-commit',$commit,'--iscc','C:/Program Files (x86)/Inno Setup 6/ISCC.exe')
          if ($env:EXPECTED_VERSION) { $arguments += @('--expected-version', $env:EXPECTED_VERSION) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Verify install and uninstall
        shell: pwsh
        run: ./tooling/scripts/test_installer.ps1 -PackageDir release-output -Workspace "$env:RUNNER_TEMP/installer-smoke"
      - name: Verify upgrade from TypingTracker 0.9.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskManifest = Get-Content -LiteralPath 'release-output/payload/release-manifest.json' | ConvertFrom-Json
          if ($taskManifest.product_name -eq 'Sariana') {
            $taskHeaders = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN" }
            $taskPrevious = Invoke-RestMethod -Uri 'https://api.github.com/repos/JeropsWang/typing-tracker/releases/tags/v0.9.2' -Headers $taskHeaders
            $taskAsset = @($taskPrevious.assets | Where-Object name -eq 'TypingTracker-0.9.2-windows-x64-setup.exe')
            if ($taskAsset.Count -ne 1 -or $taskAsset[0].state -ne 'uploaded') { throw 'Previous installer missing' }
            if ($taskAsset[0].digest -notmatch '^sha256:([a-f0-9]{64})$') { throw 'Previous installer digest missing' }
            $taskExpectedHash = $Matches[1]
            $taskLegacySetup = Join-Path $env:RUNNER_TEMP 'TypingTracker-0.9.2-setup.exe'
            # 用附件 ID 避开替换附件后的旧重定向缓存，下载后仍须核对 SHA-256。
            $taskDownload = $taskAsset[0].browser_download_url + '?asset_id=' + $taskAsset[0].id
            Invoke-WebRequest -Uri $taskDownload -OutFile $taskLegacySetup
            if ((Get-FileHash -LiteralPath $taskLegacySetup).Hash.ToLowerInvariant() -ne $taskExpectedHash) { throw 'Previous installer checksum mismatch' }
            ./tooling/scripts/test_installer.ps1 -PackageDir release-output -Workspace "$env:RUNNER_TEMP/upgrade-smoke" -UpgradeFromSetup $taskLegacySetup
          } else {
            Write-Output 'Historical TypingTracker build: rename upgrade check is not applicable'
          }
      - name: Verify upgrade from Sariana 0.9.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskManifest = Get-Content -LiteralPath 'release-output/payload/release-manifest.json' | ConvertFrom-Json
          if ($taskManifest.product_name -eq 'Sariana' -and [version]$taskManifest.version -ge [version]'0.9.4') {
            $taskHeaders = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN" }
            $taskPrevious = Invoke-RestMethod -Uri 'https://api.github.com/repos/JeropsWang/typing-tracker/releases/tags/v0.9.3' -Headers $taskHeaders
            $taskAsset = @($taskPrevious.assets | Where-Object name -eq 'Sariana-0.9.3-windows-x64-setup.exe')
            if ($taskAsset.Count -ne 1 -or $taskAsset[0].state -ne 'uploaded') { throw 'Previous Sariana installer missing' }
            if ($taskAsset[0].digest -notmatch '^sha256:([a-f0-9]{64})$') { throw 'Previous Sariana installer digest missing' }
            $taskExpectedHash = $Matches[1]
            $taskPreviousSetup = Join-Path $env:RUNNER_TEMP 'Sariana-0.9.3-setup.exe'
            Invoke-WebRequest -Uri ($taskAsset[0].browser_download_url + '?asset_id=' + $taskAsset[0].id) -OutFile $taskPreviousSetup
            if ((Get-FileHash -LiteralPath $taskPreviousSetup).Hash.ToLowerInvariant() -ne $taskExpectedHash) { throw 'Previous Sariana installer checksum mismatch' }
            ./tooling/scripts/test_installer.ps1 -PackageDir release-output -Workspace "$env:RUNNER_TEMP/sariana-upgrade-smoke" -UpgradeFromSetup $taskPreviousSetup
          } else {
            Write-Output 'Historical build: same-brand upgrade check is not applicable'
          }
      - name: Verify upgrade from recent Sariana versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskManifest = Get-Content -LiteralPath 'release-output/payload/release-manifest.json' | ConvertFrom-Json
          if ($taskManifest.product_name -eq 'Sariana' -and [version]$taskManifest.version -ge [version]'0.9.5') {
            $taskHeaders = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN" }
            $taskBaselines = @('0.9.4')
            # 0.9.7起覆盖当前正式版升级；历史0.9.5/0.9.6补编译不测试降级安装。
            if ([version]$taskManifest.version -gt [version]'0.9.6') { $taskBaselines += '0.9.6' }
            if ([version]$taskManifest.version -gt [version]'0.9.7') { $taskBaselines += '0.9.7' }
            foreach ($taskVersion in $taskBaselines) {
              $taskPrevious = Invoke-RestMethod -Uri "https://api.github.com/repos/JeropsWang/typing-tracker/releases/tags/v$taskVersion" -Headers $taskHeaders
              $taskAsset = @($taskPrevious.assets | Where-Object name -eq "Sariana-$taskVersion-windows-x64-setup.exe")
              if ($taskAsset.Count -ne 1 -or $taskAsset[0].state -ne 'uploaded') { throw "$taskVersion installer missing" }
              if ($taskAsset[0].digest -notmatch '^sha256:([a-f0-9]{64})$') { throw "$taskVersion installer digest missing" }
              $taskExpectedHash = $Matches[1]
              $taskPreviousSetup = Join-Path $env:RUNNER_TEMP "Sariana-$taskVersion-setup.exe"
              Invoke-WebRequest -Uri ($taskAsset[0].browser_download_url + '?asset_id=' + $taskAsset[0].id) -OutFile $taskPreviousSetup
              if ((Get-FileHash -LiteralPath $taskPreviousSetup).Hash.ToLowerInvariant() -ne $taskExpectedHash) { throw "$taskVersion installer checksum mismatch" }
              ./tooling/scripts/test_installer.ps1 -PackageDir release-output -Workspace "$env:RUNNER_TEMP/sariana-$taskVersion-upgrade-smoke" -UpgradeFromSetup $taskPreviousSetup
            }
          }
      - name: Verify reinstall from the same published version
        # 重打包构建不上传，先下载旧附件验工同版本覆盖安装；保留旧资产直到验证结束。
        if: github.event_name == 'workflow_dispatch' && inputs.build_only && inputs.source_ref != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $taskManifest = Get-Content -LiteralPath 'release-output/payload/release-manifest.json' | ConvertFrom-Json
          $taskHeaders = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN" }
          $taskPrevious = Invoke-RestMethod -Uri "https://api.github.com/repos/JeropsWang/typing-tracker/releases/tags/$env:RELEASE_TAG" -Headers $taskHeaders
          $taskName = "$($taskManifest.product_name)-$($taskManifest.version)-windows-x64-setup.exe"
          $taskAsset = @($taskPrevious.assets | Where-Object name -eq $taskName)
          if ($taskAsset.Count -ne 1 -or $taskAsset[0].state -ne 'uploaded') { throw 'Original same-version installer missing' }
          if ($taskAsset[0].digest -notmatch '^sha256:([a-f0-9]{64})$') { throw 'Original installer digest missing' }
          $taskExpectedHash = $Matches[1]
          $taskOldSetup = Join-Path $env:RUNNER_TEMP 'same-version-original-setup.exe'
          Invoke-WebRequest -Uri ($taskAsset[0].browser_download_url + '?asset_id=' + $taskAsset[0].id) -OutFile $taskOldSetup
          if ((Get-FileHash -LiteralPath $taskOldSetup).Hash.ToLowerInvariant() -ne $taskExpectedHash) { throw 'Original installer checksum mismatch' }
          ./tooling/scripts/test_installer.ps1 -PackageDir release-output -Workspace "$env:RUNNER_TEMP/same-version-smoke" -UpgradeFromSetup $taskOldSetup
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-output/assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    # 只有 build 成功才可上传；此权限仅授予发布任务，不授予构建任务。
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.build_only)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: assets
      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
          gh release upload "$RELEASE_TAG" assets/* --repo "$GH_REPO" --clobber
      - name: Publish verified draft
        # 附件上传与公开草稿分开，手动显式选择后才将已经验证的草稿转为正式版。
        if: github.event_name == 'workflow_dispatch' && inputs.publish_draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
