name: sariana-search

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
      SEARXNG_PORT: "8080"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
    volumes:
      - ../../.local/searxng/config:/etc/searxng
      - ../../.local/searxng/data:/var/cache/searxng
